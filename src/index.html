<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlyphEngine Playground</title>
    <meta name="description" content="Write and share GlyphEngine programs in the browser.">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1 data-i18n="title">GlyphEngine Playground</h1>
        <select id="lang" data-i18n-aria-label="language">
            <option value="ts">TypeScript</option>
            <option value="js">JavaScript</option>
        </select>
        <button id="run" type="button" data-i18n="run" data-i18n-title="run.title"></button>
        <button id="share" type="button" data-i18n="share"></button>
        <span id="status" role="status"></span>
    </header>
    <main>
        <div id="code" aria-describedby="hint"></div>
        <!-- No allow-same-origin: shared programs can't reach this page, its storage or cookies -->
        <iframe id="output" sandbox="allow-scripts" data-i18n-title="output"></iframe>
    </main>
    <footer>
        <pre id="errors" role="alert"></pre>
        <p id="hint" data-i18n="hint"></p>
    </footer>
    <script type="module" src="./playground.ts"></script>
</body>
</html>
