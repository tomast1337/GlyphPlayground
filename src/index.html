<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlyphEngine Playground</title>
    <meta name="description" content="Write and share GlyphEngine programs in the browser.">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>GlyphEngine Playground</h1>
        <select id="lang" aria-label="Language">
            <option value="ts">TypeScript</option>
            <option value="js">JavaScript</option>
        </select>
        <button id="run" type="button" title="Ctrl+Enter">Run</button>
        <button id="share" type="button">Copy link</button>
        <span id="status" role="status"></span>
    </header>
    <main>
        <div id="code" aria-describedby="hint"></div>
        <!-- No allow-same-origin: shared programs can't reach this page, its storage or cookies -->
        <iframe id="output" sandbox="allow-scripts" title="Program output"></iframe>
    </main>
    <footer>
        <pre id="errors" role="alert"></pre>
        <p id="hint">Ctrl+Enter runs. Tab indents; press Esc first to move focus out of the editor. TypeScript types are removed, not checked.</p>
    </footer>
    <script type="module" src="./playground.ts"></script>
</body>
</html>
